name: KouturePro — vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kp_test
          POSTGRES_USER: kp_test
          POSTGRES_PASSWORD: test-only-not-production
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kp_test -d kp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tests SQLite, PostgreSQL et Function Vercel simulée
        run: npm test
        env:
          TEST_POSTGRES_URL: postgresql://kp_test:test-only-not-production@127.0.0.1:55432/kp_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:auth
